services:
  db:
    image: postgres:15-alpine
    container_name: smart-logistics-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistics_db}
      POSTGRES_USER: ${POSTGRES_USER:-user_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password_secure}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user_admin} -d ${POSTGRES_DB:-logistics_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AI Engine
  ai-engine:
    build: ./ai-engine
    container_name: ai-engine-service
    environment:
      - MODEL_MODE=development
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Backend Core
  backend-core:
    build: ./backend-core
    container_name: backend-core-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-logistics_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-user_admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-password_secure}
      - AI_ENGINE_URL=http://ai-engine:8000
      - GEOCODING_USER_AGENT=${GEOCODING_USER_AGENT:-SmartRouteLogistics/0.1 (+https://github.com/carlosjc31/smartroute-logistics)}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-engine:
        condition: service_started

  grafana:
    image: grafana/grafana-oss:latest
    container_name: smart-logistics-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - db

networks:
  default:
    name: smart-logistics-network

