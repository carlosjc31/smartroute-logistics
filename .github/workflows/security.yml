name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # toda segunda: novas CVEs aparecem mesmo sem mudança no código

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varre todo o histórico do git
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  trivy:
    name: Dependências e imagens (Trivy)
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.58.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # Bloqueia CVEs CRÍTICAS com correção disponível; ALTAS aparecem no log para triagem.
      # Exceções aceitas (com justificativa e expiração) ficam no .trivyignore
      - name: Dependências (pom.xml, uv.lock, package-lock.json)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" $TRIVY \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore /src
          docker run --rm -v "$PWD:/src:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" $TRIVY \
            fs --scanners vuln --severity CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore --exit-code 1 /src
      - name: Configuração (Dockerfiles e compose)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" $TRIVY \
            config --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Imagens do ai-engine e do backend-core
        run: |
          docker build -t smartroute/ai-engine:scan ai-engine
          docker build -t smartroute/backend-core:scan backend-core
          for image in smartroute/ai-engine:scan smartroute/backend-core:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD/.trivyignore:/.trivyignore:ro" \
              $TRIVY image --severity CRITICAL --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 "$image"
          done

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
