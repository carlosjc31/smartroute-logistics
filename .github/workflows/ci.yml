name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Specs (rastreabilidade requisito ↔ teste)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Spec implemented com requisito sem teste @req, ou @req para requisito inexistente, falha o PR
      - run: python3 scripts/check_spec_traceability.py --report

  contract:
    name: Contrato da API (oasdiff)
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: 1.41.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instala o oasdiff (versão fixa, checksum conferido)
        run: |
          cd "$RUNNER_TEMP"
          file="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          curl -sSfLO "$base/$file" && curl -sSfLO "$base/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" oasdiff && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Quebra de compatibilidade só passa com o rótulo "quebra-de-contrato" no PR (ADR 0009)
      - name: Quebras em relação à branch de destino
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'quebra-de-contrato') }}
        run: |
          if ! git cat-file -e "origin/$BASE_REF:contracts/api/openapi.yaml" 2>/dev/null; then
            echo "Contrato ainda não existe em $BASE_REF; nada a comparar."; exit 0
          fi
          git show "origin/$BASE_REF:contracts/api/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
          oasdiff changelog "$RUNNER_TEMP/base.yaml" contracts/api/openapi.yaml --format markdown >> "$GITHUB_STEP_SUMMARY"
          if [ "$ALLOW_BREAKING" = "true" ]; then
            oasdiff breaking "$RUNNER_TEMP/base.yaml" contracts/api/openapi.yaml
          else
            oasdiff breaking "$RUNNER_TEMP/base.yaml" contracts/api/openapi.yaml --fail-on ERR --format githubactions
          fi

  backend:
    name: backend-core (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unitários, contrato, PostgreSQL embarcado, integração com Testcontainers (*IT) e cobertura JaCoCo
      - run: ./mvnw -B verify
      # No CI há Docker: um *IT pulado (disabledWithoutDocker) significa integração não testada
      - name: Garantir que nenhum teste de integração foi pulado
        run: |
          ls target/failsafe-reports/TEST-*IT.xml
          if grep -L 'skipped="0"' target/failsafe-reports/TEST-*IT.xml | grep -q .; then
            echo "::error::Testes *IT foram pulados; o Testcontainers não conseguiu usar o Docker"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend-core/target/site/jacoco/
            backend-core/target/surefire-reports/
            backend-core/target/failsafe-reports/
          if-no-files-found: ignore

  ai-engine:
    name: ai-engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-engine/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    name: frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartroute-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartroute-frontend/package-lock.json
      - run: npm ci
      # Os tipos da API são gerados do contrato: arquivo desatualizado falha o PR
      - name: Tipos gerados conferem com o contrato
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts || { echo "::error::Rode 'npm run generate:api' e versione src/api/schema.d.ts"; exit 1; }
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright sobre docker compose)
    needs: [backend, ai-engine, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Segredos aleatórios a cada execução: prova que nada depende de senha versionada (#30)
      - name: Gera .env com segredos aleatórios
        run: |
          cp .env.example .env
          for var in POSTGRES_PASSWORD AI_ENGINE_TOKEN KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_DEV_USERS_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            sed -i "s|^$var=.*|$var=$value|" .env
          done
          echo "E2E_PASSWORD=$(grep '^KEYCLOAK_DEV_USERS_PASSWORD=' .env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Sobe banco, Keycloak, ai-engine e backend
        run: |
          # --wait: aguarda os healthchecks (ai-engine só fica saudável com o modelo carregado)
          docker compose up -d --build --wait --wait-timeout 300 db keycloak ai-engine backend-core
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null \
              && curl -sf http://localhost:8180/realms/smartroute/.well-known/openid-configuration > /dev/null; then
              echo "Serviços prontos"; exit 0
            fi
            sleep 3
          done
          echo "Serviços não ficaram prontos a tempo"; exit 1
      - name: Portas internas não ficam expostas no host
        run: |
          if curl -s --max-time 3 http://localhost:8000/health; then
            echo "::error::ai-engine acessível no host (porta 8000)"; exit 1
          fi
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
            echo "::error::PostgreSQL acessível no host (porta 5432)"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartroute-frontend/package-lock.json
      - working-directory: smartroute-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - working-directory: smartroute-frontend
        run: npm run e2e
        env:
          E2E_API_URL: http://localhost:8080
          E2E_EXPECT_ETA_SOURCE: MODEL
      # DAST: OWASP ZAP sobre a API (OpenAPI). Falha só em regras FAIL; avisos ficam no relatório.
      - name: OWASP ZAP (API scan)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.15.0 \
            zap-api-scan.py -t http://localhost:8080/v3/api-docs -f openapi -I -r zap-report.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            smartroute-frontend/playwright-report/
            smartroute-frontend/test-results/
      - if: always()
        run: docker compose down -v
