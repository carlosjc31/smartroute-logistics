name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-core (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unitários, contrato, PostgreSQL embarcado, integração com Testcontainers (*IT) e cobertura JaCoCo
      - run: ./mvnw -B verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend-core/target/site/jacoco/
            backend-core/target/surefire-reports/
            backend-core/target/failsafe-reports/
          if-no-files-found: ignore

  ai-engine:
    name: ai-engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-engine/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    name: frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartroute-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartroute-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright sobre docker compose)
    needs: [backend, ai-engine, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe banco, ai-engine e backend
        run: |
          docker compose up -d --build db ai-engine backend-core
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null \
              && curl -sf http://localhost:8000/health | grep -q '"Active"'; then
              echo "Serviços prontos"; exit 0
            fi
            sleep 3
          done
          echo "Serviços não ficaram prontos a tempo"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartroute-frontend/package-lock.json
      - working-directory: smartroute-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - working-directory: smartroute-frontend
        run: npm run e2e
        env:
          E2E_API_URL: http://localhost:8080
          E2E_EXPECT_ETA_SOURCE: MODEL
      - if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            smartroute-frontend/playwright-report/
            smartroute-frontend/test-results/
      - if: always()
        run: docker compose down -v
