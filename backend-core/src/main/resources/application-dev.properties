# Desenvolvimento local. Endereços padrão batem com o docker-compose.yml; senhas nunca têm padrão versionado
# (defina SPRING_DATASOURCE_PASSWORD com o POSTGRES_PASSWORD do seu .env).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Keycloak do docker compose (porta 8180) e frontend local (Vite dev 5173, preview 4173)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/smartroute}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
# Token de serviço do ai-engine local: suba o ai-engine com SERVICE_TOKEN igual a este valor
ai-engine.token=${AI_ENGINE_TOKEN:dev-local-token}
