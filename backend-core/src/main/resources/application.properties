# Configuração comum a todos os ambientes. Ajustes por ambiente em application-<perfil>.properties.
spring.application.name=backend-core
spring.profiles.default=dev

# Banco: schema versionado pelo Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
# Bancos criados antes do Flyway (ddl-auto=update) recebem o baseline 0 e rodam V1 (idempotente) e V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Outbox de eventos (Spring Modulith, ADR 0004): tabela criada pelo Flyway (V4) no schema "events"
spring.modulith.events.jdbc.schema=events
spring.modulith.events.jdbc.schema-initialization.enabled=false

# Mantém o fuso enviado pelo cliente: a hora local de saída é feature do modelo (trânsito)
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# ai-engine
ai-engine.url=${AI_ENGINE_URL:http://localhost:8000}
ai-engine.token=${AI_ENGINE_TOKEN}
ai-engine.connect-timeout=2s
ai-engine.read-timeout=5s

resilience4j.retry.instances.aiEngine.max-attempts=2
resilience4j.retry.instances.aiEngine.wait-duration=300ms
resilience4j.retry.instances.aiEngine.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.aiEngine.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiEngine.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aiEngine.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiEngine.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.aiEngine.permitted-number-of-calls-in-half-open-state=2

# Geocodificação (Nominatim/OpenStreetMap). Política de uso: User-Agent identificável e no máximo 1 req/s.
geocoding.base-url=${GEOCODING_URL:https://nominatim.openstreetmap.org}
geocoding.user-agent=${GEOCODING_USER_AGENT:SmartRouteLogistics/0.1 (+https://github.com/carlosjc31/smartroute-logistics)}
geocoding.country-codes=${GEOCODING_COUNTRY_CODES:br}
geocoding.min-interval=1s
geocoding.connect-timeout=3s
geocoding.read-timeout=5s

spring.cache.cache-names=geocoding
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=24h

# OpenAPI: /swagger-ui.html e /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: só health exposto (métricas na Fase 7), sem detalhes para anônimos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Segurança (Fase 3): JWT do Keycloak. issuer-uri valida o "iss"; jwk-set-uri é de onde vêm as chaves
# (pode ser o endereço interno do Keycloak). Com jwk-set-uri definido, a API sobe sem o Keycloak no ar.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:${OIDC_ISSUER_URI}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:smartroute-api}
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.rate-limit.enabled=true
app.security.rate-limit.capacity=${RATE_LIMIT_CAPACITY:120}
app.security.rate-limit.period=1m

# Erros nunca expõem mensagens internas nem stack trace
server.error.include-message=never
server.error.include-stacktrace=never
